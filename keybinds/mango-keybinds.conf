# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none


# toggle waybar
bind=SUPER,apostrophe,spawn,killall -SIGUSR1 waybar

# reload config
bind=SUPER+SHIFT,r,reload_config

# Power menu
bind=SUPER,Escape,spawn,rofi-power

# Apps
bind=SUPER,o,spawn,rofi -show drun -show-icons
bind=SUPER,p,spawn,rofi-gopass
bind=SUPER,Return,spawn,kitty
bind=SUPER,e,spawn,kitty --app-id kitty-code
bind=SUPER+SHIFT,Return,spawn,helium-browser
bind=SUPER,r,toggle_named_scratchpad,kitty-runner,none,kitty --session ~/.files/kitty/sessions/runner.conf --app-id kitty-runner
bind=SUPER,n,toggle_named_scratchpad,kitty-yazi,none,kitty --session ~/.files/kitty/sessions/yazi.conf --app-id kitty-yazi
bind=SUPER,s,toggle_named_scratchpad,kitty-surge,none,kitty --session ~/.files/kitty/sessions/surge.conf --app-id kitty-surge
bind=SUPER,v,spawn,mpv-picker
bind=SUPER,d,spawn,zathura

# Rofi scripts
bind=SUPER,k,spawn,rofi-keybinds
bind=SUPER,u,spawn,clipcat-menu
bind=SUPER,q,spawn,rofi-search
bind=SUPER+SHIFT,k,spawn,rofi-kill
bind=SUPER+SHIFT,e,spawn,rofi-emoji
bind=SUPER+SHIFT,b,spawn,rofi-bookmarks

# Screenshots
# bind=,Print,spawn,grim ~/Files/pics/screenshot-$(date +%s).png
bind=SUPER+SHIFT,s,spawn,grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%s).png

# Scratchpad extras
bind=SUPER,c,toggle_named_scratchpad,qalculate-gtk,none,qalculate-gtk
bind=SUPER,b,toggle_named_scratchpad,kitty-btop,none,kitty --session ~/.files/kitty/sessions/btop.conf --app-id kitty-btop
bind=SUPER,y,toggle_named_scratchpad,kitty-notes,none,kitty --session ~/.files/kitty/sessions/notes.conf --app-id kitty-notes
bind=SUPER,t,toggle_named_scratchpad,org.gnome.clocks,none,gnome-clocks

# exit
bind=SUPER+SHIFT,m,quit
bind=SUPER+SHIFT,q,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
# bind=SUPER,g,toggleglobal,
bind=SUPER+SHIFT,Tab,toggleoverview,
bind=SUPER,space,togglefloating,
# bind=SUPER,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
# bind=SUPER+SHIFT,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER,z,zoom
bind=SUPER+SHIFT,z,toggle_scratchpad

# tag switch (prev/next workspace)
bind=SUPER,comma,viewtoleft_have_client,0
bind=SUPER,period,viewtoright_have_client,0
bind=SUPER,semicolon,focuslast
bind=SUPER+SHIFT,semicolon,switch_layout
bind=SUPER+SHIFT,comma,tagtoleft,0
bind=SUPER+SHIFT,period,tagtoright,0

# view: switch to workspace
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,1,tagsilent,1,0
bind=SUPER+SHIFT,2,tagsilent,2,0
bind=SUPER+SHIFT,3,tagsilent,3,0
bind=SUPER+SHIFT,4,tagsilent,4,0
bind=SUPER+SHIFT,5,tagsilent,5,0
bind=SUPER+SHIFT,6,tagsilent,6,0
bind=SUPER+SHIFT,7,tagsilent,7,0
bind=SUPER+SHIFT,8,tagsilent,8,0
bind=SUPER+SHIFT,9,tagsilent,9,0


# movewin (nudge window position)
bind=SUPER+CTRL+SHIFT,Up,movewin,+0,-50
bind=SUPER+CTRL+SHIFT,Down,movewin,+0,+50
bind=SUPER+CTRL+SHIFT,Left,movewin,-50,+0
bind=SUPER+CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=SUPER+ALT,Up,resizewin,+0,-50
bind=SUPER+ALT,Down,resizewin,+0,+50
bind=SUPER+ALT,Left,resizewin,-50,+0
bind=SUPER+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
# mousebind=NONE,btn_middle,minimized,0
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Volume
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
