# Desktop (alpha)

# monitor
monitor_rule=name:DP-1,width:3840,height:2160,refresh:60,x:0,y:0
# monitor_rule=name:HDMI-A-1,width:1920,height:1080,refresh:60,x:3840,y:0,rr:3

# idle: screen off at 5m, lock + suspend at 10m, lock before sleep
exec_once = swayidle -w timeout 300 'mmsg dispatch sleep_monitor:all' timeout 600 'systemctl suspend'
