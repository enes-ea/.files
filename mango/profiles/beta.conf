# Laptop (beta)

# monitor: left to auto-detect, add a monitor_rule here for a fixed mode
# monitor_rule=name:eDP-1,width:2560,height:1440,refresh:60,x:0,y:0

# idle: screen off at 5m, lock + suspend at 10m, lock before sleep and lid close
exec_once = swayidle -w timeout 300 'mmsg dispatch sleep_monitor:all' timeout 600 'swaylock -f && systemctl suspend' before-sleep 'swaylock -f' lock 'swaylock -f'
