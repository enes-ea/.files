# More option see https://github.com/DreamMaoMao/mango/wiki/

exec_once = waybar -c /home/enes/.files/waybar/config.jsonc -s /home/enes/.files/waybar/style.css
exec_once = swayidle -w timeout 300 'swaylock -f' timeout 600 'systemctl suspend' before-sleep 'swaylock -f'

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=300
animation_duration_close=300
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
smart_gaps=1

# Overview Setting
hotarea_size=10
enable_hotarea=1
# ov_tab_mode=0
overview_gap_inner=5
overview_gap_outer=30

# Misc
tag_carousel=1
circle_layout=tile,scroller
no_border_when_single=1
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=0
gap_outer_vertical=0
single_scratchpad=0
scratchpad_width_ratio=0.30
scratchpad_height_ratio=0.9
border_px=1
root_color=0x11111bff
border_color=0x585b70ff
drop_color=0x11111b55
split_color=0xcba6f7ff
focus_color=0x89b4faff
maximized_screen_color=0xa6e3a1ff
urgent_color=0xf38ba8ff
scratchpad_color=0xf5c2e7ff
global_color=0xfab387ff
overlay_color=0x313244ff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# window rule
window_rule=tags:1,app_id:kitty-code
window_rule=tags:3,idle_inhibit_when_focus:1,app_id:helium
window_rule=tags:4,app_id:mpv
window_rule=idle_inhibit_when_focus:1,app_id:mpv
window_rule=tags:4,app_id:spotify
window_rule=tags:5,app_id:zathura
window_rule=idle_inhibit_when_focus:1,app_id:zathura

window_rule=is_floating:1,width:900,height:500,app_id:org.pulseaudio.pavucontrol
window_rule=is_named_scratchpad:1,animation_type_open:slide,animation_type_close:slide,width:0.35,height:0.95,offset_x:100,app_id:kitty-runner
window_rule=is_named_scratchpad:1,animation_type_open:slide,animation_type_close:slide,width:0.35,height:0.95,offset_x:100,app_id:kitty-yazi
window_rule=is_named_scratchpad:1,animation_type_open:slide,animation_type_close:slide,width:0.20,height:750,offset_x:0,offset_y:100,app_id:qalculate-gtk
window_rule=is_named_scratchpad:1,animation_type_open:slide,animation_type_close:slide,width:0.35,height:0.95,offset_x:100,app_id:kitty-btop
window_rule=is_named_scratchpad:1,animation_type_open:slide,animation_type_close:slide,width:0.35,height:0.95,offset_x:100,app_id:kitty-notes

window_rule=is_named_scratchpad:1,animation_type_open:slide,animation_type_close:slide,width:0.35,height:0.95,offset_x:100,app_id:kitty-surge
window_rule=is_named_scratchpad:1,animation_type_open:slide,animation_type_close:slide,width:0.20,height:750,offset_x:0,offset_y:100,app_id:org.gnome.clocks

# layer rule
layer_rule=animation_type_open:slide,layer_name:rofi
layer_rule=animation_type_close:slide,layer_name:rofi

# monitor
monitor_rule=name:DP-1,width:3840,height:2160,refresh:60,x:0,y:0
# monitor_rule=name:HDMI-A-1,width:1920,height:1080,refresh:60,x:3840,y:0,rr:3

source=~/.config/mango/env.conf
source=~/.config/mango/private.conf
source=~/.config/mango/keybinds.conf
