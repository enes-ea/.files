# Main mpv options
background-color='#000000'
osd-back-color='#15161e'
osd-border-color='#15161e'
osd-color='#c0caf5'
osd-shadow-color='#1a1b26'

# Stats script options
# Options are on separate lines for clarity
# Colors are in #BBGGRR format
script-opts-append=stats-border_color=1e1616
script-opts-append=stats-font_color=f5cac0
script-opts-append=stats-plot_bg_border_color=f7a27a
script-opts-append=stats-plot_bg_color=1e1616
script-opts-append=stats-plot_color=f7a27a

# External script options
# It is fine to leave these here even if one does not use these scripts because they are just ignored unless a script uses them

# UOSC options
script-opts-append=uosc-color=foreground=7aa2f7,foreground_text=15161e,background=1a1b26,background_text=c0caf5,curtain=16161e,success=9ece6a,error=f7768e

# --- Video ---
profile=gpu-hq            # high quality scaling
gpu-api=vulkan            # best on AMD (or opengl)
hwdec=vaapi               # hardware decoding (AMD on Linux)
hwdec-codecs=all
vo=gpu-next               # next-gen video output renderer
target-peak=auto           # proper HDR brightness mapping
video-sync=display-resample # sync playback to display refresh rate
video-sync-max-video-change=0.01 # limit speed variation to 1%
interpolation              # smooth motion interpolation
tscale=oversample          # best interpolation algorithm for 24→60Hz

# --- Scaling ---
scale=ewa_lanczos         # high quality upscale
dscale=mitchell           # downscale
cscale=ewa_lanczos        # chroma scale

# --- Audio ---
volume=100
volume-max=150            # allow boosting above 100%
audio-file-auto=fuzzy     # auto-load external audio tracks
alang=tr,en               # preferred audio language

# --- Subtitles ---
slang=tr,en               # preferred subtitle language
sub-auto=fuzzy            # fuzzy subtitle file matching
sub-font="JetBrains Mono"
sub-font-size=42
sub-border-size=2
sub-color="#FFFFFFFF"
sub-border-color="#000000"
sub-shadow-offset=1

# --- Behavior ---
save-position-on-quit     # resume where you left off
keep-open=yes             # don't close when video ends
autofit=85%               # window size relative to screen
cursor-autohide=1000      # hide cursor after 1s
screenshot-directory=~/Media/Pictures/mpv
screenshot-format=png
