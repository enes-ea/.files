# vim:ft=kitty

# ============================================================================
# FONT CONFIGURATION
# ============================================================================
font_family      family="JetBrainsMono Nerd Font" style="Regular"
bold_font        family="JetBrainsMono Nerd Font" style="ExtraBold"
italic_font      family="JetBrainsMono Nerd Font" style="Italic"
bold_italic_font family="JetBrainsMono Nerd Font" style="ExtraBold Italic"
font_size        13
modify_font underline_position +2px

# ============================================================================
# THEME & COLOR CONFIGURATION
# ============================================================================
# The basic colors
foreground              #f2f4f8
background              #161616
selection_foreground    #f2f4f8
selection_background    #2a2a2a

# Cursor colors
cursor                  #f2f4f8
cursor_text_color       #161616

# URL underline color when hovering with mouse
url_color               #25be6a

# Kitty window border colors
active_border_color     #78a9ff
inactive_border_color   #535353
bell_border_color       #3ddbd9

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #0c0c0c
active_tab_background   #78a9ff
inactive_tab_foreground #6e6f70
inactive_tab_background #2a2a2a
tab_bar_background      #0c0c0c

# Colors for marks (marked text in the terminal)
mark1_foreground #0c0c0c
mark1_background #78a9ff
mark2_foreground #0c0c0c
mark2_background #be95ff
mark3_foreground #0c0c0c
mark3_background #33b1ff

# The 16 terminal colors

# black
color0 #282828
color8 #484848

# red
color1 #ee5396
color9 #f16da6

# green
color2  #25be6a
color10 #46c880

# yellow
color3  #08bdba
color11 #2dc7c4

# blue
color4  #78a9ff
color12 #8cb6ff

# magenta
color5  #be95ff
color13 #c8a5ff

# cyan
color6  #33b1ff
color14 #52bdff

# white
color7  #dfdfe0
color15 #e4e4e5

# extended colors
color16 #3ddbd9
color17 #ff7eb6

# Cursor settings
cursor_shape block
cursor_blink_interval 0.5

# ============================================================================
# TAB BAR CONFIGURATION
# ============================================================================
tab_powerline_style round
tab_bar_style powerline
tab_bar_edge top
tab_bar_align left
tab_bar_min_tabs 2
tab_title_template "{index}: {title}"

# ============================================================================
# GENERAL SETTINGS
# ============================================================================
scrollback_lines 10000
copy_on_select yes
enable_audio_bell no
hide_window_decorations yes
mouse_hide_wait 1.0
confirm_os_window_close 0

# Shell and editor
shell fish
editor nvim

# System
allow_remote_control yes
listen_on unix:@mykitty
update_check_interval 0

# Display settings
placement_strategy top-left
enabled_layouts tall
linux_display_server wayland
kitty_mod ctrl+shift

# ============================================================================
# Performance
# ============================================================================
input_delay 0
repaint_delay 2
sync_to_monitor yes
linux_display_server wayland
wayland_enable_ime no

# ============================================================================
# KEYBOARD SHORTCUTS
# ============================================================================
include keybinds.conf
globinclude *.local.conf
