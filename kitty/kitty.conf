# vim:ft=kitty

# ============================================================================
# FONT CONFIGURATION
# ============================================================================
font_family      family="JetBrainsMono Nerd Font" style="Regular"
bold_font        family="JetBrainsMono Nerd Font" style="ExtraBold"
italic_font      family="JetBrainsMono Nerd Font" style="Italic"
bold_italic_font family="JetBrainsMono Nerd Font" style="ExtraBold Italic"
font_size        14
modify_font underline_position +2px

# ============================================================================
# THEME & COLOR CONFIGURATION
# ============================================================================
# The basic colors
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5E0DC

# Cursor colors
cursor                  #F5E0DC
cursor_text_color       #1E1E2E

# URL underline color when hovering with mouse
url_color               #F5E0DC

# Kitty window border colors
active_border_color     #B4BEFE
inactive_border_color   #6C7086
bell_border_color       #F9E2AF

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #11111B
active_tab_background   #CBA6F7
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825
tab_bar_background      #11111B

# Colors for marks (marked text in the terminal)
mark1_foreground #1E1E2E
mark1_background #B4BEFE
mark2_foreground #1E1E2E
mark2_background #CBA6F7
mark3_foreground #1E1E2E
mark3_background #74C7EC

# The 16 terminal colors

# black
color0 #45475A
color8 #585B70

# red
color1 #F38BA8
color9 #F38BA8

# green
color2  #A6E3A1
color10 #A6E3A1

# yellow
color3  #F9E2AF
color11 #F9E2AF

# blue
color4  #89B4FA
color12 #89B4FA

# magenta
color5  #F5C2E7
color13 #F5C2E7

# cyan
color6  #94E2D5
color14 #94E2D5

# white
color7  #BAC2DE
color15 #A6ADC8

# Cursor settings
cursor_shape block
cursor_blink_interval 0.5

# ============================================================================
# TAB BAR CONFIGURATION
# ============================================================================
tab_powerline_style round
tab_bar_style powerline
tab_bar_edge top
tab_bar_align left
tab_bar_min_tabs 2
tab_title_template "{index}"

# ============================================================================
# GENERAL SETTINGS
# ============================================================================
scrollback_lines 10000
copy_on_select yes
enable_audio_bell no
hide_window_decorations yes
mouse_hide_wait 1.0
confirm_os_window_close 0

# Shell and editor
shell fish
editor nvim

# System
allow_remote_control yes
listen_on unix:@mykitty
update_check_interval 0

# Display settings
enabled_layouts tall
linux_display_server wayland
kitty_mod ctrl+shift

# ============================================================================
# Performance
# ============================================================================
input_delay 0
repaint_delay 2
sync_to_monitor yes
linux_display_server wayland
wayland_enable_ime no

# ============================================================================
# KEYBOARD SHORTCUTS
# ============================================================================
include keybinds.conf
