# vim:ft=kitty

# ============================================================================
# FONT CONFIGURATION
# ============================================================================
font_family      family="JetBrainsMono Nerd Font" style="Regular"
bold_font        family="JetBrainsMono Nerd Font" style="ExtraBold"
italic_font      family="JetBrainsMono Nerd Font" style="Italic"
bold_italic_font family="JetBrainsMono Nerd Font" style="ExtraBold Italic"
font_size        13
modify_font underline_position +2px

# ============================================================================
# THEME & COLOR CONFIGURATION
# ============================================================================
# The basic colors
foreground              #c0caf5
background              #1a1b26
selection_foreground    #c0caf5
selection_background    #283457

# Cursor colors
cursor                  #c0caf5
cursor_text_color       #1a1b26

# URL underline color when hovering with mouse
url_color               #73daca

# Kitty window border colors
active_border_color     #7aa2f7
inactive_border_color   #292e42
bell_border_color       #e0af68

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #16161e
active_tab_background   #7aa2f7
inactive_tab_foreground #545c7e
inactive_tab_background #292e42
tab_bar_background      #15161e

# Colors for marks (marked text in the terminal)
mark1_foreground #1a1b26
mark1_background #7aa2f7
mark2_foreground #1a1b26
mark2_background #bb9af7
mark3_foreground #1a1b26
mark3_background #7dcfff

# The 16 terminal colors

# black
color0 #15161e
color8 #414868

# red
color1 #f7768e
color9 #ff899d

# green
color2  #9ece6a
color10 #9fe044

# yellow
color3  #e0af68
color11 #faba4a

# blue
color4  #7aa2f7
color12 #8db0ff

# magenta
color5  #bb9af7
color13 #c7a9ff

# cyan
color6  #7dcfff
color14 #a4daff

# white
color7  #a9b1d6
color15 #c0caf5

# extended colors
color16 #ff9e64
color17 #db4b4b

# Cursor settings
cursor_shape block
cursor_blink_interval 0.5

# ============================================================================
# TAB BAR CONFIGURATION
# ============================================================================
tab_powerline_style round
tab_bar_style powerline
tab_bar_edge top
tab_bar_align left
tab_bar_min_tabs 2
tab_title_template "{index}: {title}"

# ============================================================================
# GENERAL SETTINGS
# ============================================================================
scrollback_lines 10000
copy_on_select yes
enable_audio_bell no
hide_window_decorations yes
mouse_hide_wait 1.0
confirm_os_window_close 0

# Shell and editor
shell fish
editor nvim

# System
allow_remote_control yes
listen_on unix:@mykitty
update_check_interval 0

# Display settings
enabled_layouts tall
linux_display_server wayland
kitty_mod ctrl+shift

# ============================================================================
# Performance
# ============================================================================
input_delay 0
repaint_delay 2
sync_to_monitor yes
linux_display_server wayland
wayland_enable_ime no

# ============================================================================
# KEYBOARD SHORTCUTS
# ============================================================================
include keybinds.conf
globinclude *.local.conf
